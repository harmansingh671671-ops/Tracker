<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e172e" />
      <stop offset="50%" stop-color="#0b1326" />
      <stop offset="100%" stop-color="#060e20" />
    </linearGradient>

    <!-- Radial Ambient Glow -->
    <radialGradient id="mintGlow" cx="256" cy="230" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5af0b3" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#bdc2ff" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0b1326" stop-opacity="0" />
    </radialGradient>

    <!-- Block 1: Peak Gold Gradient -->
    <linearGradient id="goldBlockGrad" x1="120" y1="130" x2="390" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffa929" />
      <stop offset="100%" stop-color="#ffcf96" />
    </linearGradient>

    <!-- Block 2: Core Mint Emerald Gradient -->
    <linearGradient id="mintBlockGrad" x1="100" y1="225" x2="410" y2="285" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#45dfa4" />
      <stop offset="50%" stop-color="#5af0b3" />
      <stop offset="100%" stop-color="#68fcbf" />
    </linearGradient>

    <!-- Block 3: Foundation Periwinkle Lavender Gradient -->
    <linearGradient id="lavenderBlockGrad" x1="120" y1="320" x2="390" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2f3aa3" />
      <stop offset="40%" stop-color="#7e88ff" />
      <stop offset="100%" stop-color="#bdc2ff" />
    </linearGradient>

    <!-- Timeline Spine Gradient -->
    <linearGradient id="spineGrad" x1="170" y1="120" x2="170" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffa929" />
      <stop offset="50%" stop-color="#5af0b3" />
      <stop offset="100%" stop-color="#7e88ff" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Icon Squircle (Matching iOS / Android Rounded Canvas) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="112" fill="url(#mintGlow)" />
  <rect x="1.5" y="1.5" width="509" height="509" rx="110.5" stroke="#222a3d" stroke-width="3" opacity="0.8" />

  <!-- Vertical Temporal Spine / Progress Cadence Axis -->
  <line x1="168" y1="130" x2="168" y2="380" stroke="#222a3d" stroke-width="8" stroke-linecap="round" />
  <line x1="168" y1="140" x2="168" y2="370" stroke="url(#spineGrad)" stroke-width="4" stroke-linecap="round" opacity="0.85" />

  <!-- BLOCK 3 (Foundation / Base Cadence & Rest - Periwinkle Lavender #bdc2ff) -->
  <g transform="translate(0, 0)">
    <!-- Ambient block shadow -->
    <rect x="136" y="324" width="220" height="56" rx="28" fill="#060e20" opacity="0.6" />
    <!-- Scheduled Hour Pill -->
    <rect x="136" y="320" width="220" height="56" rx="28" fill="url(#lavenderBlockGrad)" />
    <!-- Time Tracker Indicator -->
    <circle cx="168" cy="348" r="13" fill="#0b1326" />
    <circle cx="168" cy="348" r="7" fill="#bdc2ff" />
    <!-- Scheduled Slot Track Lines -->
    <line x1="205" y1="348" x2="270" y2="348" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.4" />
    <circle cx="320" cy="348" r="5" fill="#ffffff" opacity="0.6" />
  </g>

  <!-- BLOCK 2 (Center / Deep Work & Execution - Electric Mint #5af0b3) -->
  <g filter="url(#subtleGlow)">
    <!-- Ambient block shadow -->
    <rect x="136" y="228" width="270" height="62" rx="31" fill="#060e20" opacity="0.6" />
    <!-- Main Focus Scheduled Hour Pill -->
    <rect x="136" y="224" width="270" height="62" rx="31" fill="url(#mintBlockGrad)" />
    <!-- Active Time Tracker Beacon -->
    <circle cx="168" cy="255" r="16" fill="#003825" />
    <circle cx="168" cy="255" r="9" fill="#68fcbf" />
    <!-- Focus Segment Indicator -->
    <line x1="210" y1="255" x2="315" y2="255" stroke="#003825" stroke-width="5" stroke-linecap="round" opacity="0.75" />
    <circle cx="360" cy="255" r="6" fill="#003825" opacity="0.8" />
  </g>

  <!-- BLOCK 1 (Summit / Self-Improvement & Energy - Solar Amber Gold #ffb95f) -->
  <g transform="translate(0, 0)">
    <!-- Ambient block shadow -->
    <rect x="136" y="132" width="180" height="56" rx="28" fill="#060e20" opacity="0.6" />
    <!-- Summit Scheduled Hour Pill -->
    <rect x="136" y="128" width="180" height="56" rx="28" fill="url(#goldBlockGrad)" />
    <!-- Time Tracker Indicator -->
    <circle cx="168" cy="156" r="13" fill="#2a1700" />
    <circle cx="168" cy="156" r="7" fill="#ffcf96" />
    <!-- Track Line -->
    <line x1="205" y1="156" x2="250" y2="156" stroke="#2a1700" stroke-width="4" stroke-linecap="round" opacity="0.5" />
    <circle cx="282" cy="156" r="5" fill="#2a1700" opacity="0.6" />
  </g>

  <!-- Upward Elevation Sparkle / Self-Mastery Star at Crest -->
  <g transform="translate(365, 125)">
    <circle cx="0" cy="0" r="18" fill="#ffa929" opacity="0.2" filter="url(#subtleGlow)" />
    <path d="M0 -14 L3 -3 L14 0 L3 3 L0 14 L-3 3 L-14 0 L-3 -3 Z" fill="#ffddb8" />
  </g>
</svg>
