plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def getAppVersion() {
    try {
        def versionFile = file('../../version.json')
        if (versionFile.exists()) {
            def parsed = new groovy.json.JsonSlurper().parseText(versionFile.text)
            return [code: (parsed.versionCode ?: 8) as int, name: (parsed.versionName ?: "1.3.3") as String]
        }
    } catch (Exception e) {}
    return [code: 8, name: "1.3.3"]
}

def appVer = getAppVersion()

android {
    namespace 'com.odyssey.tracker'
    compileSdk 34

    defaultConfig {
        applicationId "com.odyssey.tracker"
        minSdk 24
        targetSdk 34
        versionCode appVer.code
        versionName appVer.name
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // 16a audit 2026-10-19: 'com.google.android.material' and 'androidx.work'
    // removed — zero references in every Kotlin source, resource XML and the
    // manifest (the theme is pure AppCompat). Verify before re-adding.
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity-ktx:1.8.2'
}
