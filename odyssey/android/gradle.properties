org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# The Kotlin compile daemon cannot run on this machine's JDK.
# Android Studio bundles JBR 25.0.3, but this project is pinned to Kotlin 1.9.22
# / AGP 8.2.2 / Gradle 8.4 (all 2023-era). The daemon fails at startup with
#   java.lang.IllegalArgumentException: 25.0.3
# i.e. it cannot even parse the JDK version string, so the build dies with
# "Daemon compilation failed: null".
#
# Compiling in-process sidesteps the daemon entirely and is verified working.
# Cost: Kotlin compilation shares the Gradle daemon heap, hence the larger
# -Xmx above. If a JDK 17 is ever installed, prefer
# `org.gradle.java.home=<path to JDK 17>` over this line instead -- that is
# the properly supported configuration.
kotlin.compiler.execution.strategy=in-process
